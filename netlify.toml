[build]
  publish = "build"
  command = "npm ci && npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--production=false"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 08:00 UTC on the 1st of each month: emails last month's activity
[functions."monthly-summary"]
  schedule = "0 8 1 * *"
